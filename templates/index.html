<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BEST WIFI — Acheter un ticket</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1720;
    color: #e8edf2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .badge-demo {
    background: #ffb020;
    color: #1a1400;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
    text-align: center;
  }
  .sous-titre {
    color: #8a97a6;
    font-size: 14px;
    margin-bottom: 28px;
    text-align: center;
  }
  .categories {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .categorie {
    background: #1a2531;
    border: 2px solid #26333f;
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .categorie:active { border-color: #4da3ff; }
  .categorie.stock-vide {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .cat-info { display: flex; flex-direction: column; gap: 2px; }
  .cat-prix { font-size: 20px; font-weight: 700; }
  .cat-duree { font-size: 13px; color: #8a97a6; }
  .cat-stock { font-size: 12px; color: #4da3ff; }
  .cat-stock.vide { color: #ff5c5c; }
  form { width: 100%; max-width: 420px; margin-top: 28px; }
  label { font-size: 13px; color: #8a97a6; display: block; margin-bottom: 6px; }
  input[type=tel] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #26333f;
    background: #1a2531;
    color: #e8edf2;
    font-size: 16px;
    margin-bottom: 16px;
  }
  button[type=submit] {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #4da3ff;
    color: #0f1720;
    font-weight: 700;
    font-size: 16px;
  }
  button[type=submit]:disabled {
    background: #2c3b48;
    color: #5a6b7a;
  }
  .footer-note {
    color: #5a6b7a;
    font-size: 12px;
    margin-top: 24px;
    text-align: center;
    max-width: 340px;
  }
</style>
</head>
<body>

  <div class="badge-demo">⚠ MODE DÉMONSTRATION — aucun vrai paiement</div>
  <h1>THE BEST WIFI</h1>
  <div class="sous-titre">Choisis ta catégorie de ticket</div>

  <div class="categories" id="liste-categories">
    <!-- rempli par JavaScript -->
  </div>

  <form id="form-achat" style="display:none;">
    <label for="numero">Numéro de téléphone</label>
    <input type="tel" id="numero" name="numero" placeholder="+228 90 00 00 00" required>
    <button type="submit" id="btn-simuler">Simuler le paiement</button>
  </form>

  <div class="footer-note">
    Ceci est une démonstration technique. Le vrai paiement Mobile Money
    (Flooz / T-Money) n'est pas encore branché — voir note séparée à ce sujet.
  </div>

<script>
let categorieChoisie = null;

const noms = {100: "Ticket 100F", 200: "Ticket 200F", 300: "Ticket 300F", 500: "Ticket 500F", 2000: "Ticket 2000F"};

async function chargerStock() {
  const reponse = await fetch("/stock");
  const stock = await reponse.json();
  const conteneur = document.getElementById("liste-categories");
  conteneur.innerHTML = "";

  const ordre = [100, 200, 300, 500, 2000];
  ordre.forEach(prix => {
    const quantite = stock[prix] || 0;
    const div = document.createElement("div");
    div.className = "categorie" + (quantite === 0 ? " stock-vide" : "");
    div.innerHTML = `
      <div class="cat-info">
        <div class="cat-prix">${prix} FCFA</div>
        <div class="cat-duree">${noms[prix] || ""}</div>
      </div>
      <div class="cat-stock ${quantite === 0 ? 'vide' : ''}">
        ${quantite === 0 ? "Épuisé" : quantite + " dispo"}
      </div>
    `;
    if (quantite > 0) {
      div.addEventListener("click", () => choisirCategorie(prix, div));
    }
    conteneur.appendChild(div);
  });
}

function choisirCategorie(prix, element) {
  categorieChoisie = prix;
  document.querySelectorAll(".categorie").forEach(el => el.style.borderColor = "#26333f");
  element.style.borderColor = "#4da3ff";
  document.getElementById("form-achat").style.display = "block";
  document.getElementById("btn-simuler").textContent = `Simuler le paiement de ${prix} FCFA`;
}

document.getElementById("form-achat").addEventListener("submit", async (e) => {
  e.preventDefault();
  const numero = document.getElementById("numero").value;
  if (!categorieChoisie) return;

  const btn = document.getElementById("btn-simuler");
  btn.disabled = true;
  btn.textContent = "Traitement en cours...";

  const reponse = await fetch("/acheter", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({numero_client: numero, prix_categorie: categorieChoisie})
  });
  const data = await reponse.json();

  if (!reponse.ok) {
    alert("Erreur : " + (data.erreur || "inconnue"));
    btn.disabled = false;
    btn.textContent = `Simuler le paiement de ${categorieChoisie} FCFA`;
    return;
  }

  // Redirige vers la page de confirmation simulée
  window.location.href = "/simuler-paiement?transaction_id=" + data.transaction_id;
});

chargerStock();
</script>

</body>
</html>
